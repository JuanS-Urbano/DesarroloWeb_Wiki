<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Wiki del Curso</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/contact.css">
</head>
<body>

<div th:insert="layout.html :: header"></div>
<div th:insert="layout.html :: navigation"></div>

<main class="container">
    <section class="content">
        <h1>Formulario de Contacto</h1>
        <p>Completa el siguiente formulario y nos pondremos en contacto contigo.</p>

        <form action="/contacto/enviar" method="POST" id="contactForm" class="contact-form">

            <div class="form-group">
                <label for="nombreCompleto">Nombre completo:</label>
                <input type="text" name="nombreCompleto" id="nombreCompleto" required/>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" name="correo" id="correo" required/>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" name="telefono" id="telefono"/>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto:</label>
                <select name="asunto" id="asunto" required>
                    <option value="">Seleccione una opción</option>
                    <option>Soporte Técnico</option>
                    <option>Información General</option>
                    <option>Sugerencias</option>
                    <option>Reportar Problema</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea name="mensaje" id="mensaje" rows="6" required></textarea>
            </div>

            <div class="form-actions">
                <input type="submit" value="Enviar" class="btn btn-primary"/>
                <a href="/" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<div th:insert="layout.html :: footer"></div>

<script src="/js/contact-validation.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
