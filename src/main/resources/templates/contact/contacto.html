<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Wiki de Videojuegos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div th:replace="~{layout.html :: header}"></div>
    <div th:replace="~{layout.html :: navigation}"></div>

    <main class="container">
        <section class="content">
            <h1>Formulario de Contacto</h1>
            <p>Completa el siguiente formulario y nos pondremos en contacto contigo.
                Los campos marcados con <span class="required-mark">*</span> son obligatorios.</p>

            <!-- Banner de formulario válido -->
            <div id="formValidBanner" class="form-valid-banner" style="display: none;">
                ✔ El formulario es válido y está listo para ser enviado.
            </div>

            <form action="/contacto/enviar" method="POST" id="contactForm" class="contact-form" novalidate>

                <div class="form-group">
                    <label for="nombreCompleto">Nombre completo <span class="required-mark">*</span></label>
                    <input type="text" name="nombrecompleto" id="nombreCompleto" placeholder="Ej: Juan Pérez" />
                    <span id="nombreCompletoError" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico <span class="required-mark">*</span></label>
                    <input type="text" name="correo" id="correo" placeholder="Ej: correo@ejemplo.com" />
                    <span id="correoError" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono <span class="required-mark">*</span></label>
                    <input type="text" name="telefono" id="telefono" placeholder="Ej: 3001234567" />
                    <span id="telefonoError" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto o motivo de contacto <span class="required-mark">*</span></label>
                    <select name="asunto" id="asunto">
                        <option value="">Seleccione una opción</option>
                        <option value="Soporte Técnico">Soporte Técnico</option>
                        <option value="Información General">Información General</option>
                        <option value="Sugerencias">Sugerencias</option>
                        <option value="Reportar Problema">Reportar Problema</option>
                    </select>
                    <span id="asuntoError" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje <span class="required-mark">*</span></label>
                    <textarea name="mensaje" id="mensaje" rows="6" maxlength="400"
                        placeholder="Escribe tu mensaje aquí (mínimo 20 caracteres)..."></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span>/400 caracteres.
                        <span id="charRemaining">Faltan al menos 20 caracteres</span>
                    </div>
                    <span id="mensajeError" class="error-message"></span>
                </div>

                <div class="form-actions">
                    <input type="submit" value="Enviar" class="btn btn-primary" id="submitBtn" />
                    <a href="/" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{layout.html :: footer}"></div>

    <script src="/js/contact-validation.js"></script>
    <script src="/js/app.js"></script>

</body>

</html>
