<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Exitoso - Wiki de Videojuegos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div th:replace="~{layout.html :: header}"></div>
    <div th:replace="~{layout.html :: navigation}"></div>

    <main class="container">
        <section class="content">
            <div class="success-message">
                <h1>¡Mensaje Enviado Correctamente!</h1>
                <p>Hemos recibido tu solicitud. Nos pondremos en contacto contigo pronto.</p>
            </div>

            <div class="contact-summary" th:if="${formulario != null}">
                <h2>Resumen de tu mensaje:</h2>

                <div class="info-block">
                    <strong>Nombre:</strong>
                    <p th:text="${formulario.nombreCompleto}">Nombre</p>
                </div>

                <div class="info-block">
                    <strong>Correo:</strong>
                    <p th:text="${formulario.correo}">Correo</p>
                </div>

                <div class="info-block">
                    <strong>Teléfono:</strong>
                    <p th:text="${formulario.telefono}">Teléfono</p>
                </div>

                <div class="info-block">
                    <strong>Asunto:</strong>
                    <p th:text="${formulario.asunto}">Asunto</p>
                </div>

                <div class="info-block">
                    <strong>Mensaje:</strong>
                    <p th:text="${formulario.mensaje}">Mensaje</p>
                </div>

                <div class="info-block" th:if="${formulario.id != null}">
                    <strong>ID de registro:</strong>
                    <p th:text="${formulario.id}">1</p>
                </div>
            </div>

            <div class="action-links">
                <a href="/" class="btn btn-primary">← Volver al inicio</a>
                <a href="/contacto/formulario" class="btn btn-secondary">Enviar otro mensaje</a>
            </div>
        </section>
    </main>

    <div th:replace="~{layout.html :: footer}"></div>

    <script src="/js/app.js"></script>

</body>

</html>
