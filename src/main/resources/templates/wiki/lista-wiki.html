<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentación - Wiki del Curso</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:insert="layout.html :: header"></div>
<div th:insert="layout.html :: navigation"></div>

<main class="container">
    <section class="content">
        <h1>Documentación de la Wiki</h1>
        <p>Selecciona un tema para ver su contenido detallado:</p>

        <div class="wiki-section">
            <ul class="wiki-list">
                <li th:each="pagina : ${paginas}" class="wiki-item">
                    <a th:href="@{/wiki/pagina(slug=${pagina.slug})}"
                       class="wiki-link">
                        <span th:text="${pagina.titulo}" class="wiki-title"></span>
                        <span class="wiki-arrow">→</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="note">
            <p><em>Haz clic en cualquier tema para leer su contenido completo.</em></p>
        </div>
    </section>
</main>

<div th:insert="layout.html :: footer"></div>

<script src="/js/app.js"></script>

</body>
</html>
