<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pagina.titulo} + ' - Wiki'">Wiki</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/wiki.css">
</head>
<body>

<div th:insert="layout.html :: header"></div>
<div th:insert="layout.html :: navigation"></div>

<main class="container">
    <section class="content">
        <article class="wiki-article">
            <h1 th:text="${pagina.titulo}"></h1>
            
            <div class="article-body">
                <p th:text="${pagina.contenido}"></p>
            </div>

            <div class="article-footer">
                <a href="/wiki/lista" class="btn btn-back">← Volver al índice</a>
            </div>
        </article>
    </section>
</main>

<div th:insert="layout.html :: footer"></div>

<script src="/js/app.js"></script>

</body>
</html>
