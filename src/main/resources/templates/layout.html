<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Dinamita</title>

    <!-- Fuente (opcional pero ayuda a que se vea igual) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
<div class="page">

    <!-- HEADER tipo “tarjeta” verde como en la imagen -->
    <header class="hero">
        <div class="hero__inner">
            <h1 class="hero__title">Team Dinamita</h1>
            <p class="hero__subtitle">Documentación y conceptos básicos de desarrollo web</p>

            <nav class="hero__nav">
                <a th:href="@{/}" class="nav__link nav__link--active">Inicio</a>
                <a th:href="@{/html}" class="nav__link">HTML</a>
                <a th:href="@{/css}" class="nav__link">CSS</a>
                <a th:href="@{/contacto}" class="nav__link">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="content" th:replace="${content}"></main>

</div>
</body>
</html>
