version: '3.8'

services:
  wiki-app:
    build: .
    container_name: wiki-videogames-app
    ports:
      - "8080:8080"
    volumes:
      - wiki-data:/app/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    # H2 Console disponible en http://localhost:8080/h2-console
    # JDBC URL: jdbc:h2:file:/app/data/demo
    # User: sa
    # Password: (dejar vacío)

volumes:
  wiki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
